<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GemiX</title>
  <meta name="theme-color" content="#757575">
  <meta name="application-name" content="GemiX">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GemiX">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="./image/icon64.png">
  <link rel="apple-touch-icon" href="./image/icon256.png">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/pc.css">
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isSmartphone = /iPhone|Android.+Mobile|Windows Phone|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      if (isSmartphone) {
        document.documentElement.classList.add("unsupported-device");
        document.write(
          '<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#757575;color:#fff;font-family:Arial,sans-serif;font-size:clamp(24px,3vw,40px);text-align:center;padding:24px;box-sizing:border-box}</style><div>This app is not supported on iOS or Android.</div>'
        );
        window.__GEMIX_BLOCKED__ = true;
      }
    }());
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
